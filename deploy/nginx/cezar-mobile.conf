# Include inside the existing `server { }` block for cezar.ciey.studio.
# Install it with deploy/nginx/install.sh. Requires `listen 443 ssl http2;`
# — HTTP/1.1's six-connections-per-host limit would starve the SSE streams (NF-3).

# The push sidecar, cezar-push (S-10; apps/push-sidecar, deploy/push/install.sh).
#
# Gated exactly like the cockpit: `$cezar_gate_ok` is the variable the gate's
# `map` defines at http level (/etc/nginx/conf.d/cezar-gate.conf), so this block
# holds no secret (CLAUDE.md rule 6). It is NOT the `?key=` guard — the app only
# ever unlocks at /m/. On a host without that map `nginx -t` fails ("unknown
# variable") and install.sh rolls the whole snippet back, so nothing can
# publish the subscription endpoints ungated.
#
# A stopped sidecar answers 502 here; the app says "the notification server is
# not answering" and nothing else is affected. The service worker never sees
# these requests (its denylist, rule 4).
location ^~ /m/push/ {
    if ($cezar_gate_ok = 0) {
        return 403;
    }
    proxy_pass http://127.0.0.1:4330;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A subscription is ~0.5 KB; the sidecar refuses anything over 8 KB itself.
    client_max_body_size 16k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
}

# The static shell. Public on purpose: it holds no data, and Safari fetches the
# manifest and icons without cookies during install (R-AUTH-6).
#
# `^~` matters: nginx picks the longest prefix, so /m/ already wins over
# `location /` regardless of order in the file, but a regex location would
# otherwise take precedence over both. `^~` stops that, which makes where this
# snippet is included irrelevant.
location ^~ /m/ {
    alias /var/www/cezar-mobile/;
    try_files $uri $uri/ /m/index.html;

    # S-02 unlock. The installed app gets its session by navigating to
    # /m/?key=… — the guard's `return 302 https://$host$uri` then lands it back
    # on /m/ with the cookie set. But the vhost keeps that guard inside
    # `location /`, and this block takes /m/ away from `location /` entirely,
    # so without a copy of the guard here the key is simply ignored and the app
    # can never unlock itself (verified 2026-09-21: the shell came back 200,
    # no Set-Cookie).
    #
    # The guard holds the secret, so it is not in this repo (CLAUDE.md rule 6):
    # install.sh copies it verbatim out of the vhost into this host-only file.
    # A glob, so an install that could not extract it still passes `nginx -t`
    # and serves the shell — it just cannot unlock.
    include /etc/nginx/snippets/cezar-mobile-unlock*.conf;

    # S-12 sign-out: `POST /m/session/end` expires the session cookie, which the
    # app cannot touch itself (HttpOnly). It needs the cookie's name, which is
    # the gate's to choose, so install.sh generates it on the host from the
    # unlock guard (signout-from-unlock.sh). No secret in it. A glob for the same
    # reason as above: without it, a POST here reaches the static shell, which
    # answers 405, and the app says the session is still open.
    include /etc/nginx/snippets/cezar-mobile-signout*.conf;

    # NF-5. `connect-src 'self'` is enough because everything the app talks to —
    # the API, the SSE streams and the sidecar — is same-origin by design.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Every nested location below repeats those two headers, and must keep
    # repeating them. nginx's add_header inherits by REPLACEMENT: a block that
    # sets any add_header of its own drops every one from its parent. Declaring
    # the security headers once up here protects only the paths that match no
    # nested block — which is the icons, and not the HTML document where the CSP
    # is the whole point. `always` does not help; it governs status codes, not
    # inheritance. A `map` would let us set Cache-Control without nesting, but
    # `map` is http-context only and this file is included inside `server`.
    #
    # The worker and the entry document must never be served stale, or a deploy
    # cannot reach an installed client.
    location = /m/sw.js {
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }
    location = /m/index.html {
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }
    location = /m/manifest.webmanifest {
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }
    # Hashed filenames — safe to pin forever.
    location /m/assets/ {
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
