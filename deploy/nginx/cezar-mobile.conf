# Include inside the existing `server { }` block for cezar.ciey.studio,
# BEFORE `location /` (which proxies to Cezar). Requires `listen 443 ssl http2;`
# — HTTP/1.1's six-connections-per-host limit would starve the SSE streams (NF-3).

# The push sidecar. Same cookie check as the cockpit: subscriptions must not be
# world-writable (A6).
location /m/push/ {
    # TODO: insert the same cookie verification this vhost already uses for `/`.
    proxy_pass http://127.0.0.1:4330;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The static shell. Public on purpose: it holds no data, and Safari fetches the
# manifest and icons without cookies during install (R-AUTH-6).
location /m/ {
    alias /var/www/cezar-mobile/;
    try_files $uri $uri/ /m/index.html;

    # NF-5. `connect-src 'self'` is enough because everything the app talks to —
    # the API, the SSE streams and the sidecar — is same-origin by design.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The worker and the entry document must never be served stale, or a deploy
    # cannot reach an installed client.
    location = /m/sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /m/index.html {
        add_header Cache-Control "no-cache";
    }
    location = /m/manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    # Hashed filenames — safe to pin forever.
    location /m/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
