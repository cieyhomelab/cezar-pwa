<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve on iOS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Split by scheme so the status bar matches the theme actually rendered
         (index.css switches on prefers-color-scheme). The unqualified tag stays
         as the fallback for browsers that ignore the media attribute. -->
    <meta name="theme-color" content="#0b1117" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1117" />
    <meta name="description" content="Podgląd i sterowanie agentami Cezara" />

    <!-- iOS ignores the web app manifest and reads these instead (F-PWA-2).
         `mobile-web-app-capable` is the unprefixed standard the Apple-only tag
         was folded into; both are emitted so neither engine is left guessing. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cezar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/m/icons/apple-touch-icon-180.png" />

    <link rel="icon" type="image/svg+xml" href="/m/favicon.svg" />
    <title>Cezar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
